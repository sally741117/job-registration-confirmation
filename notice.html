<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>求才登記通知</title>
  <link rel="stylesheet" href="./styles.css?v=20260808-noticemodal2">
  <script defer src="./services.js?v=20260808-tokenlife1"></script>
  <script defer src="./notice.js?v=20260808-noticemodal2"></script>
</head>
<body>
  <main class="shell notice-shell">
    <section id="loadingView" class="success">
      <div class="success-panel">
        <h1>正在載入求才通知，請稍候……</h1>
      </div>
    </section>
    <section id="invalidView" class="success hidden">
      <div class="success-panel">
        <h1>此通知連結無效或尚未開放</h1>
        <p>請確認連結是否完整，或聯絡承辦人員。</p>
      </div>
    </section>

    <section id="noticeView" class="hidden">
      <header class="page-header">
        <p class="eyebrow">公司端通知頁</p>
        <h1>求才登記通知</h1>
        <div id="noticeCaseInfo" class="case-info"></div>
      </header>

      <section class="card">
        <div class="section-title"><span>一</span><h2>求才內容</h2></div>
        <div id="noticeFileView" class="notice-file-view"></div>
        <p class="hint">如對內容有疑問，請聯絡承辦人員。</p>
      </section>

      <section class="card">
        <div class="section-title"><span>二</span><h2>求才登記表</h2></div>
        <p class="hint">以下為本次求才登記原始資料，可點擊放大查看。</p>
        <div id="originalFilesView" class="notice-original-files"></div>
        <div class="action-row">
          <a id="downloadOriginalBtn" class="secondary link-button" target="_blank" rel="noreferrer">開啟／下載原始求才登記表</a>
        </div>
      </section>

    </section>
  </main>
</body>
</html>
