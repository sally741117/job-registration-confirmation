<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>求才登記通知</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./services.js"></script>
  <script defer src="./notice.js"></script>
</head>
<body>
  <main class="shell notice-shell">
    <section id="invalidView" class="success hidden">
      <div class="success-panel">
        <h1>此通知連結無效或尚未開放</h1>
        <p>請確認連結是否完整，或聯絡承辦人員。</p>
      </div>
    </section>

    <section id="noticeView" class="hidden">
      <header class="page-header">
        <p class="eyebrow">公司端通知頁</p>
        <h1>求才登記通知</h1>
        <div id="noticeCaseInfo" class="case-info"></div>
      </header>

      <section class="card">
        <div class="section-title"><span>一</span><h2>求才內容</h2></div>
        <div id="noticeFileView" class="notice-file-view"></div>
        <div class="action-row">
          <button id="downloadPdfBtn" class="primary" type="button">下載求才通知單 PDF</button>
          <a id="downloadOriginalBtn" class="secondary link-button" download>下載原始求才內容</a>
        </div>
        <p class="hint">如對內容有疑問，請聯絡承辦人員。</p>
      </section>

      <section class="card reminder-card">
        <h2>接下來請您留意</h2>
        <ol>
          <li>就業中心可能會致電確認求才內容。</li>
          <li>請依上方求才內容回答承辦人員問題。</li>
          <li>若承辦人員說明的資料正確，請回答「是」。</li>
          <li>若有就業中心推薦求職者，請勿直接拒絕。</li>
          <li>請留下求職者履歷表及就業中心推介卡。</li>
          <li>收到履歷或推介卡後，請儘快通知本公司承辦人員。</li>
          <li>若求才內容有任何疑問，請先聯絡負責業務。</li>
        </ol>
      </section>
    </section>
    <section id="pdfTemplate" class="pdf-sheet" aria-hidden="true"></section>
  </main>
</body>
</html>
