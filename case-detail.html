<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>案件詳情</title>
  <link rel="stylesheet" href="./styles.css?v=20260808-detailstreamline1">
  <script defer src="./services.js?v=20260808-tokenlife1"></script>
  <script defer src="./case-detail.js?v=20260808-detailstreamline1"></script>
</head>
<body class="admin-body">
  <main class="shell admin-shell">
    <section id="loadingView" class="card">
      <div class="section-title"><span>...</span><h1>案件詳情</h1></div>
      <p class="hint">案件資料載入中...</p>
      <div class="action-row">
        <a class="secondary link-button" href="./admin.html">返回案件列表</a>
      </div>
    </section>

    <section id="missingView" class="success hidden">
      <div class="success-panel">
        <h1 id="missingTitle">案件不存在</h1>
        <p id="missingText"></p>
        <div class="action-row">
          <button id="retryLoadBtn" class="secondary" type="button">重新載入</button>
          <a class="secondary link-button" href="./admin.html">返回案件列表</a>
        </div>
      </div>
    </section>

    <section id="detailView" class="hidden">
      <header id="caseHeader" class="case-detail-header"></header>

      <section class="card">
        <div class="section-title"><span>1</span><h2>公司最新回覆</h2></div>
        <div id="latestResponseMeta" class="identity-grid"></div>
        <div id="latestResponseContent" class="summary"></div>
      </section>

      <section class="card">
        <div class="section-title"><span>2</span><h2>回覆版本紀錄</h2></div>
        <div id="submissionHistory" class="version-list"></div>
      </section>

      <section class="card">
        <div class="section-title"><span>3</span><h2 id="uploadTitle">上傳求才內容</h2></div>
        <div id="uploadCaseInfo" class="notice-bind-box"></div>
        <label class="upload-box" id="noticeDropZone">拖曳或選擇檔案
          <input id="noticeFileInput" type="file" accept=".jpg,.jpeg,.png,.webp,.pdf,image/jpeg,image/png,image/webp,application/pdf">
        </label>
        <div id="fileSummary" class="summary hidden"></div>
        <div id="uploadProgress" class="hint"></div>
      </section>

      <section class="card">
        <div class="section-title"><span>4</span><h2>已上傳求才內容</h2></div>
        <div id="noticeResult" class="summary"></div>
        <div id="noticePreview"></div>
        <div id="noticeHistory" class="version-list"></div>
        <div class="action-row">
          <a id="openNoticeLinkBtn" class="secondary link-button" target="_blank" rel="noreferrer">預覽通知</a>
          <button id="copyNoticeLinkBtn" class="secondary" type="button">複製公司查看連結</button>
          <button id="deleteNoticeBtn" class="danger" type="button">刪除目前通知</button>
          <a class="secondary link-button" href="./admin.html">返回案件列表</a>
        </div>
      </section>

    </section>
  </main>
</body>
</html>
